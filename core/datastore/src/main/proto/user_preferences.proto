syntax = "proto3";
option java_package = "dev.mago.android.datastore.proto";
option java_multiple_files = true;

message UserPreferences {
  enum ThemeMode {
    THEME_MODE_SYSTEM = 0;
    THEME_MODE_LIGHT = 1;
    THEME_MODE_DARK = 2;
    THEME_MODE_AMOLED = 3;
  }
  ThemeMode theme_mode = 1;
  bool reduced_motion = 2;
}
