name: Phase 2 Bootstrap Direct

on:
  pull_request:
    branches: [main]

concurrency:
  group: mago-phase2-bootstrap-direct-20260725
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-installer-direct-20260725
          fetch-depth: 0

      - name: Restore Phase 2 source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase2-payload/part-* > /tmp/mago-phase2-source.tar.gz.b64
          base64 --decode /tmp/mago-phase2-source.tar.gz.b64 > /tmp/mago-phase2-source.tar.gz
          echo "08fc3013a42b5ba43ae9fbd69efb570cc1164efd1b35391f538dcd0bd8ae72df  /tmp/mago-phase2-source.tar.gz" | sha256sum --check
          tar -xzf /tmp/mago-phase2-source.tar.gz
          rm -rf .github/phase2-payload .github/workflows/phase2-bootstrap-direct.yml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Verify Termux Bridge v2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check check-jsonschema
          bash termux-bridge/tests/contract_test.sh
          termux-bridge/packaging/build_bundle.sh
          cp core/termux/src/main/res/raw/mago_bridge_v1.tgz /tmp/mago_bridge_first.tgz
          cp core/termux/src/main/kotlin/dev/mago/android/termux/BridgeBundleMetadata.kt /tmp/BridgeBundleMetadata.first.kt
          termux-bridge/packaging/build_bundle.sh
          cmp /tmp/mago_bridge_first.tgz core/termux/src/main/res/raw/mago_bridge_v1.tgz
          cmp /tmp/BridgeBundleMetadata.first.kt core/termux/src/main/kotlin/dev/mago/android/termux/BridgeBundleMetadata.kt

      - name: Build, lint, and run risk-based tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug \
            :domain:installation:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:termux:testDebugUnitTest \
            :core:database:testDebugUnitTest \
            :core:rpc:testDebugUnitTest 2>&1 | tee ci-logs/gradle.log

      - name: Commit verified Phase 2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Phase 2 Termux Metasploit lifecycle"
          git push origin HEAD:feature/phase2-installer-direct-20260725

      - name: Upload Phase 2 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mago-phase2-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mago-phase2-diagnostics-${{ github.run_number }}
          path: ci-logs/gradle.log
          if-no-files-found: warn
          retention-days: 7
