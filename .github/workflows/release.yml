name: Unsigned Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: Semantic version, for example 0.7.0 or 0.7.0-rc.1
        required: true
        default: 0.7.0
        type: string
      versionCode:
        description: Positive Android version code
        required: true
        default: '7'
        type: string
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'build-logic/convention/src/main/kotlin/MagoAndroidApplicationPlugin.kt'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/kotlin/dev/mago/android/AppContainer.kt'
      - 'app/src/main/kotlin/dev/mago/android/AppLockViewModel.kt'
      - 'app/src/main/kotlin/dev/mago/android/AppLockScreen.kt'
      - 'app/src/main/kotlin/dev/mago/android/MainActivity.kt'
      - 'core/security/**'
      - 'core/datastore/**'
      - 'core/ui/src/main/kotlin/dev/mago/android/ui/components/ServiceStatusCard.kt'
      - 'feature/dashboard/**'

permissions:
  contents: read

jobs:
  build-unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version_name='${{ inputs.versionName }}'
            version_code='${{ inputs.versionCode }}'
          else
            version_name='0.7.0'
            version_code='7'
          fi
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          printf 'name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'code=%s\n' "$version_code" >> "$GITHUB_OUTPUT"

      - name: Verify Termux Bridge contract and embedded bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check check-jsonschema
          bash termux-bridge/tests/contract_test.sh
          bundle=core/termux/src/main/res/raw/mago_bridge_v1.tgz
          metadata=core/termux/src/main/kotlin/dev/mago/android/termux/BridgeBundleMetadata.kt
          embedded_sha="$(sha256sum "$bundle" | awk '{print $1}')"
          metadata_sha="$(sed -n 's/.*SHA256 = "\([0-9a-f]\{64\}\)".*/\1/p' "$metadata")"
          test "$embedded_sha" = "$metadata_sha"

      - name: Build unsigned Release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -Pmago.versionName='${{ steps.version.outputs.name }}' \
            -Pmago.versionCode='${{ steps.version.outputs.code }}' \
            :app:assembleRelease :app:bundleRelease :app:lintRelease

      - name: Collect release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.name }}'
          mkdir -p release-artifacts
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          test -f "$apk"
          test -f "$aab"
          cp "$apk" "release-artifacts/MAGO-${version}-unsigned.apk"
          cp "$aab" "release-artifacts/MAGO-${version}-unsigned.aab"
          cat > release-artifacts/BUILD-METADATA.txt <<EOF
          versionName=${version}
          versionCode=${{ steps.version.outputs.code }}
          commit=${GITHUB_SHA}
          signing=unsigned
          EOF
          (
            cd release-artifacts
            sha256sum "MAGO-${version}-unsigned.apk" "MAGO-${version}-unsigned.aab" BUILD-METADATA.txt > SHA256SUMS.txt
          )

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MAGO-${{ steps.version.outputs.name }}-unsigned
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
