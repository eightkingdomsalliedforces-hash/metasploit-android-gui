name: Apply Phase 5 Read-Only Inventory

on:
  push:
    branches: [feature/phase5-database-inventory]
    paths:
      - '.github/workflows/apply-phase5-inventory.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase5-database-inventory
          fetch-depth: 0

      - name: Verify and commit inventory source
        shell: bash
        run: |
          set -euo pipefail
          payload_b64=/tmp/phase5-inventory.b64
          payload_archive=/tmp/phase5-inventory.tar.xz
          expected_length=16232
          expected_sha=c997ba91e2db2668d95bd824fbb0239c3c6bbe433636b529be6041e4df17c4a8

          cat phase5-inventory-payload/part-* > "$payload_b64"
          test "$(wc -c < "$payload_b64")" -eq "$expected_length"
          base64 --decode "$payload_b64" > "$payload_archive"
          test "$(sha256sum "$payload_archive" | awk '{print $1}')" = "$expected_sha"
          xz --test "$payload_archive"
          tar -xJf "$payload_archive" -C .

          required=(
            core/model/src/main/kotlin/dev/mago/android/model/MetasploitInventory.kt
            core/rpc/src/main/kotlin/dev/mago/android/rpc/service/RpcInventoryService.kt
            feature/inventory/src/main/kotlin/dev/mago/android/inventory/InventoryViewModel.kt
            feature/inventory/src/main/kotlin/dev/mago/android/inventory/InventoryScreen.kt
          )
          for path in "${required[@]}"; do
            test -s "$path"
          done

          git rm -r phase5-inventory-payload
          git add app core domain feature/inventory settings.gradle.kts docs/superpowers/plans

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add read-only database inventory'
          git push origin HEAD:feature/phase5-database-inventory
