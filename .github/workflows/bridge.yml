name: Termux Bridge

on:
  pull_request:
    paths:
      - 'termux-bridge/**'
      - '.github/workflows/bridge.yml'
  push:
    branches: [main]
    paths:
      - 'termux-bridge/**'
      - '.github/workflows/bridge.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          python3 -m pip install check-jsonschema
      - name: Verify Bridge contract
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            shellcheck -x -e SC1090 -P termux-bridge/scripts \
              termux-bridge/scripts/*.sh \
              termux-bridge/scripts/lib/*.sh \
              termux-bridge/scripts/actions/*.sh \
              termux-bridge/tests/*.sh
            bash termux-bridge/tests/contract_test.sh
          } 2>&1 | tee ci-logs/bridge-validation.log
      - name: Upload Bridge diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mago-bridge-diagnostics-${{ github.run_number }}
          path: ci-logs/bridge-validation.log
          if-no-files-found: error
          retention-days: 7
