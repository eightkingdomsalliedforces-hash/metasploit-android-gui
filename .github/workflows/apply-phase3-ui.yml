name: Apply Phase 3 Module Library UI

on:
  push:
    branches: [feature/phase3-module-library-ui]
    paths:
      - '.github/workflows/apply-phase3-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase3-module-library-ui
          fetch-depth: 0

      - name: Verify and apply payload
        shell: bash
        run: |
          set -euo pipefail
          payload_b64=/tmp/phase3-ui-payload.b64
          payload_archive=/tmp/phase3-ui-payload.tar.xz

          cat phase3-ui-payload/part-* > "$payload_b64"
          test "$(wc -c < "$payload_b64")" -eq 13136
          base64 --decode "$payload_b64" > "$payload_archive"
          echo 'e3c98eb252b81a4bb2ade3b9c3dcb8c284db12aaacae02790d7756423d1a2a2e  /tmp/phase3-ui-payload.tar.xz' | sha256sum --check --strict
          xz --test "$payload_archive"
          tar -xJf "$payload_archive" -C .

          test -s app/src/main/kotlin/dev/mago/android/MagoApp.kt
          test -s app/src/main/kotlin/dev/mago/android/MainActivity.kt
          test -s feature/modules/src/main/kotlin/dev/mago/android/modules/ModulesScreen.kt
          test -s feature/modules/src/main/kotlin/dev/mago/android/modules/ModulesViewModel.kt
          test -s feature/modules/src/test/kotlin/dev/mago/android/modules/ModulesLibraryStateTest.kt

          git rm -r phase3-ui-payload .github/workflows/apply-phase3-ui.yml
          git add \
            app/src/main/kotlin/dev/mago/android/MagoApp.kt \
            app/src/main/kotlin/dev/mago/android/MainActivity.kt \
            feature/modules/src/main/kotlin/dev/mago/android/modules/ModulesScreen.kt \
            feature/modules/src/main/kotlin/dev/mago/android/modules/ModulesViewModel.kt \
            feature/modules/src/test/kotlin/dev/mago/android/modules/ModulesLibraryStateTest.kt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: expose module library and execution history'
          git push origin HEAD:feature/phase3-module-library-ui
