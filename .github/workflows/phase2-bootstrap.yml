name: Phase 2 Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [feature/phase2-installer]
    paths:
      - .github/workflows/phase2-bootstrap.yml

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-installer
          fetch-depth: 0

      - name: Reconstruct and verify Phase 2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase2-patch/part-00 \
              .github/phase2-patch/part-01 \
              .github/phase2-patch/part-02 \
              .github/phase2-patch/part-03 > /tmp/mago-phase2.patch.xz.b64
          base64 --decode /tmp/mago-phase2.patch.xz.b64 > /tmp/mago-phase2.patch.xz
          echo 'ae54648946cab9fa6202b86d7dee7c1567916dfed9032d2fe10f9322a6ca1405  /tmp/mago-phase2.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/mago-phase2.patch.xz > /tmp/mago-phase2.patch
          echo '73d58dd530e6521283748a27e5cef2143ae0ce07cedfabeebed6cee6543d4a10  /tmp/mago-phase2.patch' | sha256sum --check
          git apply --check /tmp/mago-phase2.patch

      - name: Import Phase 2 source
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/mago-phase2.patch
          rm -rf .github/phase2-patch .github/phase2-payload
          rm -f .github/workflows/phase2-bootstrap.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add recoverable Termux Metasploit installer'
          git push origin HEAD:feature/phase2-installer

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Verify Phase 2 Bridge contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check check-jsonschema
          find termux-bridge/scripts termux-bridge/tests termux-bridge/packaging \
            -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash termux-bridge/tests/contract_test.sh
          termux-bridge/packaging/build_bundle.sh
          git diff --exit-code -- \
            core/termux/src/main/res/raw/mago_bridge_v1.tgz \
            core/termux/src/main/kotlin/dev/mago/android/termux/BridgeBundleMetadata.kt

      - name: Build, lint, and run risk-based unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug \
            :domain:installation:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:termux:testDebugUnitTest \
            :core:database:testDebugUnitTest \
            :core:rpc:testDebugUnitTest 2>&1 | tee ci-logs/gradle.log

      - name: Upload Phase 2 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mago-phase2-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mago-phase2-build-diagnostics-${{ github.run_number }}
          path: |
            ci-logs/gradle.log
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7
