name: Phase 2 Bootstrap

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-installer
          fetch-depth: 0

      - name: Reconstruct and verify Phase 2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          cat \
            .github/phase2-payload/part-00-00 \
            .github/phase2-payload/part-00-01 \
            .github/phase2-payload/part-00-02 \
            .github/phase2-payload/part-00-03 \
            .github/phase2-payload/part-01-00 \
            .github/phase2-payload/part-01-01 \
            .github/phase2-payload/part-01-02 \
            .github/phase2-payload/part-01-03 \
            .github/phase2-payload/part-02-00 \
            .github/phase2-payload/part-02-01 \
            .github/phase2-payload/part-02-02 \
            .github/phase2-payload/part-02-03 \
            .github/phase2-payload/part-03-00 \
            .github/phase2-payload/part-03-01 \
            .github/phase2-payload/part-03-02 \
            .github/phase2-payload/part-03-03 \
            .github/phase2-payload/part-04-00 \
            .github/phase2-payload/part-04-01 \
            .github/phase2-payload/part-04-02 > /tmp/mago-phase2-source.tar.xz.b64
          test "$(wc -c < /tmp/mago-phase2-source.tar.xz.b64)" -eq 37708
          base64 --decode /tmp/mago-phase2-source.tar.xz.b64 > /tmp/mago-phase2-source.tar.xz
          echo '5281f456877d8366c374586467ea4ae83ed921e2eaca34b08517496b60619c66  /tmp/mago-phase2-source.tar.xz' | sha256sum --check
          xz --test /tmp/mago-phase2-source.tar.xz
          tar -tJf /tmp/mago-phase2-source.tar.xz | tee ci-logs/source-files.log
          test -s ci-logs/source-files.log

      - name: Import Phase 2 source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/mago-phase2-source.tar.xz -C .
          rm -rf .github/phase2-patch .github/phase2-payload
          rm -f .github/workflows/phase2-bootstrap.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add recoverable Termux Metasploit installer'
          git push origin HEAD:feature/phase2-installer

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Verify Phase 2 Bridge contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check check-jsonschema
          find termux-bridge/scripts termux-bridge/tests termux-bridge/packaging \
            -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash termux-bridge/tests/contract_test.sh
          termux-bridge/packaging/build_bundle.sh
          git diff --exit-code -- \
            core/termux/src/main/res/raw/mago_bridge_v1.tgz \
            core/termux/src/main/kotlin/dev/mago/android/termux/BridgeBundleMetadata.kt

      - name: Build, lint, and run risk-based unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug \
            :domain:installation:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:termux:testDebugUnitTest \
            :core:database:testDebugUnitTest \
            :core:rpc:testDebugUnitTest 2>&1 | tee ci-logs/gradle.log

      - name: Upload Phase 2 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mago-phase2-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mago-phase2-build-diagnostics-${{ github.run_number }}
          path: |
            ci-logs/source-files.log
            ci-logs/gradle.log
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7
