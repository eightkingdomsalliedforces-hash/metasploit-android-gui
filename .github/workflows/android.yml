name: Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Verify Termux Bridge contract and embedded bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs /tmp/mago-embedded /tmp/mago-rebuilt
          {
            python3 -m pip install --disable-pip-version-check check-jsonschema
            bash termux-bridge/tests/contract_test.sh
            bash -n termux-bridge/scripts/dispatch.sh termux-bridge/scripts/lib/common.sh termux-bridge/scripts/actions/*.sh

            bundle=core/termux/src/main/res/raw/mago_bridge_v1.tgz
            metadata=core/termux/src/main/kotlin/dev/mago/android/termux/BridgeBundleMetadata.kt
            cp "$bundle" /tmp/mago-embedded.tgz
            cp "$metadata" /tmp/mago-embedded-metadata.kt

            embedded_sha="$(sha256sum "$bundle" | awk '{print $1}')"
            metadata_sha="$(sed -n 's/.*SHA256 = "\([0-9a-f]\{64\}\)".*/\1/p' "$metadata")"
            printf 'Embedded bundle SHA-256: %s\n' "$embedded_sha"
            printf 'Metadata SHA-256:        %s\n' "$metadata_sha"
            test "$embedded_sha" = "$metadata_sha"

            tar -xzf /tmp/mago-embedded.tgz -C /tmp/mago-embedded
            termux-bridge/packaging/build_bundle.sh
            rebuilt_sha="$(sha256sum "$bundle" | awk '{print $1}')"
            printf 'Runner rebuilt SHA-256:  %s\n' "$rebuilt_sha"
            tar -xzf "$bundle" -C /tmp/mago-rebuilt

            diff -ru /tmp/mago-embedded/bridge-v1 /tmp/mago-rebuilt/bridge-v1
            (
              cd /tmp/mago-embedded/bridge-v1
              find . -printf '%P %m\n' | LC_ALL=C sort
            ) > /tmp/mago-embedded-modes.txt
            (
              cd /tmp/mago-rebuilt/bridge-v1
              find . -printf '%P %m\n' | LC_ALL=C sort
            ) > /tmp/mago-rebuilt-modes.txt
            diff -u /tmp/mago-embedded-modes.txt /tmp/mago-rebuilt-modes.txt

            cp /tmp/mago-embedded.tgz "$bundle"
            cp /tmp/mago-embedded-metadata.kt "$metadata"
            git diff --exit-code -- \
              termux-bridge/scripts \
              termux-bridge/packaging/build_bundle.sh \
              "$bundle" \
              "$metadata"
          } 2>&1 | tee ci-logs/bundle-validation.log
      - name: Build, lint, and run risk-based unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug \
            :app:testDebugUnitTest \
            :domain:installation:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:termux:testDebugUnitTest \
            :core:database:testDebugUnitTest \
            :core:rpc:testDebugUnitTest \
            :core:reporting:testDebugUnitTest \
            :feature:modules:testDebugUnitTest \
            :feature:dashboard:testDebugUnitTest \
            :feature:inventory:testDebugUnitTest \
            :feature:reports:testDebugUnitTest \
            :feature:diagnostics:testDebugUnitTest 2>&1 | tee ci-logs/gradle.log
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mago-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mago-build-diagnostics-${{ github.run_number }}
          path: |
            ci-logs/bundle-validation.log
            ci-logs/gradle.log
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7