name: Android

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Verify Termux Bridge contract and embedded bundle
        run: |
          python3 -m pip install --disable-pip-version-check check-jsonschema
          bash termux-bridge/tests/contract_test.sh
          termux-bridge/packaging/build_bundle.sh
          git diff --exit-code -- \
            core/termux/src/main/res/raw/mago_bridge_v1.tgz \
            core/termux/src/main/kotlin/dev/mago/android/termux/BridgeBundleMetadata.kt
      - name: Build, lint, and run risk-based unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug \
            :domain:installation:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:termux:testDebugUnitTest \
            :core:database:testDebugUnitTest \
            :core:rpc:testDebugUnitTest 2>&1 | tee ci-logs/gradle.log
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mago-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mago-build-diagnostics-${{ github.run_number }}
          path: |
            ci-logs/gradle.log
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7
